<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rokuzen</title>
  <link rel="stylesheet" href="./botao-encerrar.css">
</head>
<body>
  <header>
    <!--Logo Rokuzen-->
    <img src="logorokuzen.png" alt="Logo Roku Zen" class="logo">
    <!--Usuario-->
    <img src="usericon.png" alt="Ícone de usuário" class="user-icon">
  </header>

  <main>
    <div class="content">
        <!--Temporizador-->
      <div id="timer">00:00</div>
      <!--Botao de encerrar-->
      <button id="end-btn">Terminar</button>
    </div>
  </main>

  <script>
    // Mesmo temporizador
    let seconds = 0;
    let timer;
    const timerDisplay = document.getElementById('timer');
    const endBtn = document.getElementById('end-btn');

    // Inicia automaticamente o cronômetro
    timer = setInterval(() => {
      seconds++;
      const min = String(Math.floor(seconds / 60)).padStart(2, '0');
      const sec = String(seconds % 60).padStart(2, '0');
      timerDisplay.textContent = `${min}:${sec}`;
    }, 1000);

    // Ao clicar em "Terminar", para o tempo e mostra um alerta
    endBtn.addEventListener('click', () => {
      clearInterval(timer);
      alert(`Sessão encerrada! Tempo total: ${timerDisplay.textContent}`);
    });
  </script>
</body>
</html>
